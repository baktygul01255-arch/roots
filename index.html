<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Корень n-й степени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&family=PT+Mono&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: школьная тетрадь — красная линия полей, вкладки, слева текст учебника, справа рисунок/модель на клетчатой бумаге */
:root{
  --paper:#f6f7fb; --surface:#ffffff; --ink:#1c2746; --muted:#5b6582; --line:#d8ddea;
  --grid:rgba(60,95,170,.09); --accent:#2d4db3; --accent-soft:#e4e9f9; --margin:#d1475a;
  --ok:#1d8656; --ok-soft:#e1f3ea; --bad:#c13838; --bad-soft:#fbe6e6;
  --c1:#2d4db3; --c2:#c2410c; --c3:#7c3aed; --c4:#15803d;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Arial,sans-serif;
  --f-math:"PT Serif",Georgia,serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11162a; --surface:#171e36; --ink:#e5e9f4; --muted:#9aa3bf; --line:#2a3352;
  --grid:rgba(140,170,255,.07); --accent:#93a9ff; --accent-soft:#222c4c; --margin:#ff7c8b;
  --ok:#4fc68f; --ok-soft:#173528; --bad:#ff7b7b; --bad-soft:#3a1e24;
  --c1:#6c84e0; --c2:#d9733c; --c3:#9470dc; --c4:#2fa463; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{font-size:137.5%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;transition:background .2s,color .2s}
.wrap{max-width:min(78rem,100%);margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:relative;padding-block:28px 20px;padding-left:22px;display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-start}
header.top::before{content:"";position:absolute;left:0;top:24px;bottom:16px;width:2px;background:var(--margin)}
.htext{flex:1 1 520px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px}
.sw button{font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;border:0;background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.sw svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;margin:.25em 0 .2em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{max-width:64ch;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-size:1.5rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:1.2rem;margin:0}
p{margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
nav.tabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m{font-family:var(--f-math);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.12;margin:0 .08em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .18em}
.fr>span:last-child{padding:0 .18em}
.paper-grid{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:10px}
svg.plot{display:block;width:100%;height:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.duo.wideR{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
@media (max-width:980px){.duo,.duo.wideR{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.defn{border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;line-height:1.6}
.fblock{display:block;text-align:center;font-family:var(--f-math);font-size:1.18em;margin-top:6px}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 14px;line-height:1.6}
.ex{border-left:3px solid var(--margin);padding-left:12px;line-height:1.7}
.ex .lbl{display:block;margin-bottom:2px}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;line-height:1.55}
.lbl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-math);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{color:var(--muted);font-weight:400}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;line-height:1.4}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip{font-family:var(--f-math);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--paper);border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:5px 12px;font-size:.9rem}
select,input.num{font:inherit;font-family:var(--f-math);padding:4px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
input.num{width:6em}
input[type=range]{width:100%;accent-color:var(--accent)}
.sl{display:grid;grid-template-columns:minmax(4em,auto) 1fr 5.5em;gap:10px;align-items:center}
.sl .vl{font-family:var(--f-math);text-align:right}
.big{font-family:var(--f-math);font-size:1.35rem;line-height:1.7}
.eq{font-family:var(--f-math);font-size:1.6rem;line-height:1.6}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:2em 1fr;gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:.85rem;color:var(--paper);background:var(--accent);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;margin-top:.2em}
.steps .why{color:var(--muted);font-size:.92rem;display:block}
.steps .mx{font-family:var(--f-math);font-size:1.2rem;line-height:1.9;overflow-x:auto;display:block}
.sMode{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;margin:6px 0 12px;cursor:pointer}
.sMode input{width:1.2em;height:1.2em;accent-color:var(--accent)}
.work{border:2px dashed var(--line);border-radius:12px;min-height:220px;padding:12px 16px;color:var(--muted);font-size:.95rem;margin-bottom:14px}
#sCheck .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
#sCheck .fb{font-weight:700;margin:6px 0 12px}
#sCheck .fb.ok{color:var(--ok)}#sCheck .fb.bad{color:var(--bad)}
#sCtl .btn[disabled]{opacity:.4;cursor:default}
@media (max-width:700px){#sCheck .opts{grid-template-columns:1fr}}
.answer{border:2px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:10px 14px;font-family:var(--f-math);font-size:1.3rem;line-height:1.8}
.answer.none{border-color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.qwrap{max-width:880px}
.stat{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.stat b{color:var(--ink);font-weight:400}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcat{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qtext{font-size:1.2rem;line-height:1.6}
.qtext .m{font-size:1.12em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px}
.opt{font:inherit;font-family:var(--f-math);font-size:1.08rem;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;min-height:2.6em;line-height:1.6}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.expl{border-radius:8px;padding:12px 14px;font-size:1rem;line-height:1.8}
.expl.ok{background:var(--ok-soft)} .expl.no{background:var(--bad-soft)}
.expl b{display:block;margin-bottom:2px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--f-display);font-size:3rem;line-height:1}
.review{display:flex;flex-direction:column;gap:12px}
.review > div{border-left:3px solid var(--bad);padding:4px 0 4px 12px;line-height:1.7;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.opt .m{white-space:normal}
#trBox .opts,#testBox .opts{grid-template-columns:1fr}
#sWork{min-height:max(560px,62vh);border:2px dashed var(--line);font-size:.85rem;margin-top:4px}
.vwork{min-height:320px;font-size:.85rem;margin:0}
.mtag{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;background:var(--accent-soft);color:var(--accent)}
.cmp td,.cmp th{white-space:normal;text-align:left;vertical-align:top;line-height:1.5}
.cmp td{font-family:var(--f-math)}
.tcard{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:22px;align-items:start}
@media (max-width:980px){.tcard{grid-template-columns:1fr}}
.sticky{position:sticky;top:64px}
@media (max-width:980px){.sticky{position:static}}
.circ{max-width:620px;width:100%;margin-inline:auto}
.cap,.lbl{text-transform:none!important;letter-spacing:.02em!important}
.pg button{font:inherit;font-family:var(--f-math);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;line-height:1.4}
.pg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#sCheck .opts{grid-template-columns:1fr!important}
.task .opts{grid-template-columns:1fr 1fr}
@media (max-width:800px){.task .opts{grid-template-columns:1fr}}
.cap{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.pg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.pgl{font-size:.8rem;font-weight:700;color:var(--muted);min-width:6.5em}
#sPre button{font-family:var(--f-math)}
#sPre{display:block}
.fbt{font-weight:700;border-radius:999px;padding:2px 12px;font-size:.85rem}
.fbt.ok{background:var(--ok-soft);color:var(--ok)}.fbt.bad{background:var(--bad-soft);color:var(--bad)}
details.qa{border-top:1px solid var(--line);padding:10px 0}
details.qa summary{cursor:pointer;font-weight:700}
details.qa p{margin-top:8px;color:var(--muted)}
.task .qtext{font-size:1.25rem}
.gen8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;max-width:1240px;margin-inline:auto;width:100%}
@media (max-width:700px){.gen8{grid-template-columns:1fr}}
.g8{margin:0;display:flex;flex-direction:column;gap:6px}
.g8t{font-family:var(--f-math);font-weight:700;font-size:1.25rem;text-align:center}
.g8f{border:1.5px solid var(--ink);border-radius:8px;padding:6px 10px;text-align:center;font-family:var(--f-math);font-size:.95rem;line-height:1.7}
.mctl{display:flex;flex-direction:column;gap:10px}
h1{overflow-wrap:break-word;hyphens:auto}
</style>
<style>
.rt{white-space:nowrap;font-family:var(--f-math)}
.ov{border-top:1.6px solid currentColor;padding:0 .12em;margin-left:.02em;display:inline-block;line-height:1.15}
.ri{font-size:.62em;margin-right:-.42em;vertical-align:.95em;position:relative;left:.05em}
.props td{font-family:var(--f-math);font-size:1.05rem;line-height:2}
.pc{font-family:var(--f-body);font-size:.8rem;color:var(--muted);line-height:1.3}
.muted{color:var(--muted)}
.know{background:var(--accent-soft);border-radius:10px;padding:10px 14px;line-height:1.6}
.know .kt,.qbox .kt{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.know .ip{margin:6px 0 0;padding-left:1.4em;font-family:var(--f-math)}
.qbox{border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px}.qbox ol{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.sol{margin-top:6px;font-family:var(--f-math);line-height:2}
details.qa{border-top:1px solid var(--line);padding:8px 0}details.qa summary{cursor:pointer;font-weight:700;color:var(--accent)}details.qa p{margin-top:6px;font-family:var(--f-math);line-height:2}
.bk{display:inline-block;font-family:var(--f-body);font-size:.8rem;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;vertical-align:middle;margin-right:6px}

.sticky{position:sticky;top:64px}@media (max-width:980px){.sticky{position:static}}
.tcard>*{min-width:0}
.mq{font-family:var(--f-math);font-size:1.5rem}
.qtext .rt,.eq .rt{font-size:1.05em}
.eq{font-size:1.7rem}
</style>
<div class="wrap">
  <header class="top">
    <div class="htext">
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="h1"></h1>
      <p class="lead" data-i="lead"></p>
    </div>
    <div class="ctrls">
      <div class="sw" id="langSw" role="group" aria-label="Тіл / Язык"><button data-lang="ru">РУС</button><button data-lang="kz">ҚАЗ</button></div>
      <div class="sw" id="sizeSw" role="group" aria-label="Размер шрифта"><button data-sz="16">A</button><button data-sz="22">A+</button><button data-sz="28">A++</button></div>
      <div class="sw" id="themeSw" role="group" aria-label="Тема">
        <button data-th="light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i="light"></span></button>
        <button data-th="dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-i="dark"></span></button>
      </div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="t-theory" data-tab="theory" data-i="tTheory"></button>
    <button role="tab" id="t-model" data-tab="model" data-i="tModel"></button>
    <button role="tab" id="t-solve" data-tab="solve" data-i="tSolve"></button>
    <button role="tab" id="t-train" data-tab="train" data-i="tTrain"></button>
    <button role="tab" id="t-test" data-tab="test" data-i="tTest"></button>
  </nav>
  <main>
  <div id="p-theory" class="pane"><div class="stack" id="theoryBox"></div></div>
  <div id="p-model" class="pane" hidden><div class="stack">
    <div class="card"><span class="lbl" data-i="m1L"></span><div class="duo"><div class="stack">
      <div class="seg" id="m1n"></div>
      <div class="sl"><span class="m">a</span><input type="range" id="m1a" min="-30" max="100" step="0.5"><span class="vl" id="m1av"></span></div>
      <div class="seg"><button class="chip" data-m1a="-27">−27</button><button class="chip" data-m1a="-8">−8</button><button class="chip" data-m1a="0">0</button><button class="chip" data-m1a="1">1</button><button class="chip" data-m1a="16">16</button><button class="chip" data-m1a="32">32</button><button class="chip" data-m1a="64">64</button><button class="chip" data-m1a="81">81</button></div>
      <div class="mq" id="m1Eq"></div><div class="answer" id="m1Msg" style="font-size:1.1rem"></div></div>
      <div class="paper-grid"><svg id="m1G" class="plot" role="img" aria-label="x^n=a"></svg></div></div></div>
    <div class="card"><span class="lbl" data-i="m2L"></span><div class="duo"><div class="stack">
      <div class="seg" id="m2n"></div><label class="sMode"><input type="checkbox" id="m2s"> <span data-i="m2sL"></span></label><p id="m2Msg"></p></div>
      <div class="paper-grid"><svg id="m2G" class="plot" role="img" aria-label="roots"></svg></div></div></div>
    <div class="card"><span class="lbl" data-i="m3L"></span><div class="duo"><div class="stack">
      <div class="sl"><span class="m">a</span><input type="range" id="m3b" min="0.1" max="9" step="0.1"><span class="vl" id="m3bv"></span></div>
      <div class="sl"><span class="m">m</span><input type="range" id="m3m" min="-6" max="6" step="1"><span class="vl" id="m3mv"></span></div>
      <div class="sl"><span class="m">n</span><input type="range" id="m3d" min="1" max="6" step="1"><span class="vl" id="m3dv"></span></div>
      <div class="mq" id="m3Eq"></div><p id="m3Msg"></p></div>
      <div class="paper-grid"><svg id="m3G" class="plot" role="img" aria-label="a^x"></svg></div></div></div>
  </div></div>
  <div id="p-solve" class="pane" hidden>
    <div class="duo wideR">
      <div class="stack"><div class="card"><span class="lbl" data-i="genL"></span><div class="seg" id="sGen"></div><p style="color:var(--muted);font-size:.9rem" data-i="genHint"></p></div></div>
      <div class="stack"><div class="card"><div class="eq" id="sEq"></div>
        <label class="sMode"><input type="checkbox" class="teach"> <span data-i="sAllL"></span></label>
        <div id="sWork" class="work paper-grid"></div><div id="sCheck"></div>
        <ol class="steps" id="sSteps"></ol><div id="sAns"></div><div class="row" id="sCtl" style="margin-top:14px"></div></div></div>
    </div>
  </div>
  <div id="p-train" class="pane" hidden>

function trimN(x,d){let s=x.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s;}
function fmt(x,sig=4){if(!isFinite(x))return'—';if(Math.abs(x)<1e-12)return'0';const a=Math.abs(x);const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));return trimN(x,Math.min(d,8)).replace('.',',').replace('-','−');}

function fplot(svg,o){const{x0,x1,y0,y1,W,H}=o;svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const X=x=>(x-x0)/(x1-x0)*W,Y=y=>(y1-y)/(y1-y0)*H;const sx=o.sx||1,sy=o.sy||1;
  for(let v=Math.ceil(x0/sx)*sx;v<=x1;v+=sx)el('line',{x1:X(v),x2:X(v),y1:0,y2:H,stroke:'var(--line)'},svg);
  for(let v=Math.ceil(y0/sy)*sy;v<=y1;v+=sy)el('line',{x1:0,x2:W,y1:Y(v),y2:Y(v),stroke:'var(--line)'},svg);
  const id='ar'+Math.random().toString(36).slice(2,8);const d=el('defs',{},svg),mk=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:8,markerHeight:8,orient:'auto'},d);el('path',{d:'M0 0L10 5L0 10z',fill:'var(--muted)'},mk);
  el('line',{x1:0,x2:W-2,y1:Y(0),y2:Y(0),stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#${id})`},svg);el('line',{x1:X(0),x2:X(0),y1:H,y2:2,stroke:'var(--muted)','stroke-width':2,'marker-end':`url(#${id})`},svg);
  const lx=o.lx||sx,ly=o.ly||sy;

  for(let v=Math.ceil(y0/ly)*ly;v<=y1-ly*.3;v+=ly){if(Math.abs(v)<1e-9)continue;txt(svg,fmt(v),X(0)-8,Y(v)+6,{'text-anchor':'end','font-size':16,fill:'var(--muted)'});}
  txt(svg,'x',W-16,Y(0)-10,{'font-style':'italic',fill:'var(--muted)'});txt(svg,'y',X(0)+10,18,{'font-style':'italic',fill:'var(--muted)'});txt(svg,'0',X(0)-14,Y(0)+20,{'font-size':16,fill:'var(--muted)'});
  const curve=(f,a,b,at)=>{let dd='',on=false;const N=600;for(let i=0;i<=N;i++){const x=a+(b-a)*i/N,y=f(x);if(!isFinite(y)||y>y1+(y1-y0)||y<y0-(y1-y0)){on=false;continue;}dd+=(on?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);on=true;}return el('path',Object.assign({d:dd,fill:'none','stroke-width':3,'stroke-linejoin':'round'},at||{}),svg);};
  return{X,Y,curve,svg};}

function renderTheory(){
  const R=rad,F=frac,sup=(b,e)=>`${b}<sup>${e}</sup>`;

  const qs=a=>`<div class="qbox"><span class="kt">?</span><ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
  const props5=[[`(${R('n','a')})<sup>n</sup> = a`],[`${R('n','ab')} = ${R('n','a')}·${R('n','b')}`],[`${R('nk',sup('a','k'))} = ${R('n','a')}`],[`${R('n',F('a','b'))} = ${F(R('n','a'),R('n','b'))}`],[`(${R('n','a')})<sup>k</sup> = ${R('n',sup('a','k'))}`],[`${R('n',R('k','a'))} = ${R('nk','a')}`]];
  const props6=[`a<sup>r</sup>·a<sup>s</sup> = a<sup>r+s</sup>`,`a<sup>r</sup> : a<sup>s</sup> = a<sup>r−s</sup>`,`(a<sup>r</sup>)<sup>s</sup> = a<sup>rs</sup>`,`(ab)<sup>r</sup> = a<sup>r</sup>b<sup>r</sup>`,`(${F('a','b')})<sup>r</sup> = ${F('a<sup>r</sup>','b<sup>r</sup>')}`];
  const intp=[`a<sup>m</sup>·a<sup>n</sup> = a<sup>m+n</sup>`,`a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup> (a ≠ 0)`,`(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>`,`(ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>`,`(${F('a','b')})<sup>n</sup> = ${F('a<sup>n</sup>','b<sup>n</sup>')} (b ≠ 0)`,L('если m &gt; n, то a<sup>m</sup> &gt; a<sup>n</sup> при a &gt; 1; a<sup>m</sup> &lt; a<sup>n</sup> при 0 &lt; a &lt; 1','егер m &gt; n болса, онда a &gt; 1 жағдайында a<sup>m</sup> &gt; a<sup>n</sup>; 0 &lt; a &lt; 1 жағдайында a<sup>m</sup> &lt; a<sup>n</sup>')];
  $('#theoryBox').innerHTML=`
  <div class="card"><div class="tcard"><div class="stack">
    <h2>§ 5. ${L('Корень n-й степени и его свойства','n-ші дәрежелі түбір және оның қасиеттері')}</h2>
    ${box(L('Вы знаете','Сендер білесіңдер'),L('Квадратный корень из числа 25 равен 5, так как 5² = 25, т. е. квадратный корень из числа a есть число, квадрат которого равен числу a.','Мысалы, 25 санының арифметикалық квадрат түбірі 5-ке тең, өйткені 5² = 25. a санының квадрат түбірі квадраты a санына тең болатын қандай да бір сан.'))}
    <p>${L('Таким же образом можно дать определение корня n-й степени.','Тура осылай a санының <b>n-ші дәрежелі түбірінің</b> анықтамасын беруге болады.')}</p>
    <div class="defn">${L('<b>Определение.</b> <i><b>Корнем n-й степени</b> (n — натуральное число, отличное от 1) из числа a называется такое число b, n-я степень которого равна числу a.</i>','<b>Анықтама.</b> <i>a санының <b>n-ші дәрежелі түбірі</b> деп n-ші дәрежесі a санына тең болатын b санын айтады.</i>')}<span class="fblock">${R('n','a')} = b, ${L('где','мұндағы')} a = bⁿ. &nbsp;&nbsp;(1)</span></div>
    <p>${L('Здесь a — число, находящееся под знаком корня, n — показатель корня, b — корень n-й степени числа a (n ∈ N). Например, корень третьей степени из числа 27 равен 3, так как: ∛27 = 3, т. е. 3³ = 27.','Мұнда a саны — n-ші дәрежелі түбір таңбасының ішіндегі сан, n — түбірдің көрсеткіші және n ∈ N (n ≠ 1), b саны a санының n-ші дәрежелі түбірі. Мысалы, 27 санының үшінші дәрежелі түбірі 3-ке тең: ∛27 = 3, өйткені 3³ = 27.')}</p>
    <p>${L('Рассмотрим случаи, когда показатель корня чётный и нечётный.','n-ші дәрежелі түбір анықтамасындағы түбір көрсеткішінің жұп және тақ болатын жағдайларын жеке қарастырайық.')}</p>
    <p>${L('Пусть n — <b>чётное</b> число, тогда bⁿ = a ≥ 0, т. е. неотрицательное число, так как чётная степень любого числа — неотрицательное число. Следовательно, подкоренное число корня с чётным показателем не может быть отрицательным числом.','n <b>жұп</b> сан болса, онда bⁿ = a ≥ 0, тек қана оң сан, себебі кез келген санның жұп дәрежесі теріс емес сан болады. Демек, жұп дәрежелі түбір таңбасының ішіндегі a саны теріс сан болуы мүмкін емес.')}</p>
    <p>${L('Если показатель корня — <b>нечётное</b> число, то можно вычислить корень из любого числа. В этом случае, в равенстве bⁿ = a знаки чисел a и b одинаковые, т. е. корень из положительного числа будет число положительное, из отрицательного числа — отрицательное.','Егер түбір көрсеткіші n <b>тақ</b> болса, онда кез келген саннан n-ші дәрежелі түбірді есептеуге болады. Бұл жағдайда bⁿ = a теңдігіндегі a және b сандарының таңбалары бірдей, яғни оң саннан оң, теріс саннан теріс түбір шығады.')}</p>
    <p class="m" style="white-space:normal">${L('Например','Мысалы')}: 1) ${R(5,'−32')} = −2, ${L('так как','себебі')} (−2)⁵ = −32; &nbsp; 2) ${R(3,64)} = 4, ${L('так как','себебі')} 4³ = 64.</p>
    <p>${L('Пусть корень n-й степени из числа a равен x, тогда по определению получаем уравнение xⁿ = a. Уравнение xⁿ = a (где a &gt; 0, n ∈ N, n ≠ 1) в случае чётного n имеет два корня: −ⁿ√a и ⁿ√a, в случае нечётного n — один корень ⁿ√a. Например, числа 7 и −7 являются корнями уравнения x⁴ = 2401, так как 7⁴ = 2401 и (−7)⁴ = 2401.','a санының n-ші дәрежелі түбірі x-ке тең болсын. Онда анықтама бойынша xⁿ = a теңдеуін аламыз. n жұп болғанда, xⁿ = a теңдеуінің (мұндағы a &gt; 0, n ∈ N, n ≠ 1) −ⁿ√a және ⁿ√a екі түбірі, ал n тақ болғанда ⁿ√a шамасына тең бір түбірі болады. Мысалы, 7 және −7 сандары x⁴ = 2401 теңдеуінің түбірі болады, өйткені 7⁴ = 2401 және (−7)⁴ = 2401.')}</p>

      <tr><td>a = 0</td><td>x = 0</td><td>x = 0</td></tr>

    <div class="defn">${L('<b>Определение.</b> <i><b>Арифметическим корнем n-й степени</b> неотрицательного числа a называется неотрицательное число b, n-я степень которого равна a.</i>','<b>Анықтама.</b> <i>Теріс емес a санының <b>n-ші дәрежелі арифметикалық түбірі</b> деп n-ші дәрежесі a санына тең болатын теріс емес b санын айтады.</i>')}</div>

  <div class="card"><div class="tcard"><div class="stack">

    <p>${L('Для положительных чисел a, b при n ∈ N, k ∈ N для корней n-й, k-й степеней выполняются следующие свойства:','n ∈ N және k ∈ N болғанда a және b теріс емес нақты сандары үшін n-ші және k-ші дәрежелі түбірлердің мына қасиеттері орындалады:')}</p>

    <details class="qa"><summary>${L('Доказательство свойства 2','2-қасиеттің дәлелдеуі')}</summary><p>${L(`По определению корня n-й степени ${R('n','ab')} есть неотрицательное число, n-я степень которого равна ab. Так как ${R('n','a')} ≥ 0, ${R('n','b')} ≥ 0, то ${R('n','a')}·${R('n','b')} — неотрицательное число. По свойству степени (a·b)ⁿ = aⁿbⁿ: (${R('n','a')}·${R('n','b')})ⁿ = (${R('n','a')})ⁿ·(${R('n','b')})ⁿ = a·b. Таким образом, ${R('n','ab')} = ${R('n','a')}·${R('n','b')}.`,`n-ші дәрежелі түбірдің анықтамасы бойынша ${R('n','ab')} дегеніміз — n-ші дәрежесі ab-ға тең теріс емес сан. ${R('n','a')} ≥ 0, ${R('n','b')} ≥ 0 болғандықтан, ${R('n','a')}·${R('n','b')} саны теріс емес. Натурал көрсеткішті дәреженің (a·b)ⁿ = aⁿbⁿ қасиеті бойынша: (${R('n','a')}·${R('n','b')})ⁿ = (${R('n','a')})ⁿ·(${R('n','b')})ⁿ = a·b. Сонымен, ${R('n','ab')} = ${R('n','a')}·${R('n','b')}.`)}</p></details>
    <details class="qa"><summary>${L('Доказательство свойства 6','6-қасиеттің дәлелдеуі')}</summary><p>${L(`Возведём в nk-ю степень выражение ${R('n',R('k','a'))}: (${R('n',R('k','a'))})<sup>nk</sup> = [(${R('n',R('k','a'))})<sup>n</sup>]<sup>k</sup> = (${R('k','a')})<sup>k</sup> = a. Следовательно, ${R('n',R('k','a'))} является корнем nk-й степени из числа a.`,`${R('n',R('k','a'))} өрнегін nk дәрежесіне шығарайық: (${R('n',R('k','a'))})<sup>nk</sup> = [(${R('n',R('k','a'))})<sup>n</sup>]<sup>k</sup> = (${R('k','a')})<sup>k</sup> = a. Соңғы теңдіктен ${R('n',R('k','a'))} өрнегі a санының nk дәрежелі түбірі екені шығады.`)}</p></details>
    <div class="note">${L(`Ещё полезно помнить: ${R('n',sup('a','n'))} = |a| при чётном n и ${R('n',sup('a','n'))} = a при нечётном n (a — любое число); если 0 ≤ a &lt; b, то ${R('n','a')} &lt; ${R('n','b')}.`,`Сондай-ақ есте сақтаңдар: жұп n үшін ${R('n',sup('a','n'))} = |a|, тақ n үшін ${R('n',sup('a','n'))} = a (a — кез келген сан); егер 0 ≤ a &lt; b болса, ${R('n','a')} &lt; ${R('n','b')}.`)}</div>
  </div><div class="stack">
    ${ex(L('Пример 1','1-мысал'),L(`Преобразуем выражения: 1) ${R(5,8)}·${R(5,4)}; 2) ${R(4,'5'+F(1,16))}; 3) ${R(3,R(5,7))}; 4) ${R(21,128)}.`,`Берілген өрнектерді түрлендірейік: 1) ${R(5,8)}·${R(5,4)}; 2) ${R(4,'5'+F(1,16))}; 3) ${R(3,R(5,7))}; 4) ${R(21,128)}.`),

    ${ex(L('Пример 2','2-мысал'),L(`Вынесем множитель из-под корня: 1) ${R(4,'243b⁴')}, b &gt; 0; 2) ${R(2,'45b⁶')}, b &lt; 0; 3) ${R(3,'500a⁶b⁸')}.`,`1) ${R(4,'243b⁴')}, b &gt; 0; 2) ${R(2,'45b⁶')}, b &lt; 0; 3) ${R(3,'500a⁶b⁸')} түбірлерінен көбейткішті түбір таңбасының алдына шығарайық.`),
      L(`1) Так как b &gt; 0, выносим положительный множитель: ${R(4,'243b⁴')} = ${R(4,'3·81·b⁴')} = 3b${R(4,3)}; 2) так как b &lt; 0, выносим отрицательный множитель: ${R(2,'45b⁶')} = ${R(2,'5·9·(b³)²')} = −3b³${R(2,5)}; 3) ${R(3,'500a⁶b⁸')} = ${R(3,'125·4·(a²)³·(b²)³·b²')} = 5a²b²${R(3,'4b²')}.`,`1) b &gt; 0 болғандықтан, түбір таңбасының ішінен оң таңбалы көбейткіш шығады: ${R(4,'243b⁴')} = ${R(4,'3·81·b⁴')} = 3b${R(4,3)}; 2) b &lt; 0, сондықтан түбір таңбасының ішінен теріс таңбалы көбейткіш шығады: ${R(2,'45b⁶')} = ${R(2,'5·9·(b³)²')} = −3b³${R(2,5)}; 3) ${R(3,'500a⁶b⁸')} = ${R(3,'125·4·(a²)³·(b²)³·b²')} = 5a²b²${R(3,'4b²')}.`),

      L(`1) Так как 4${R(3,3)} — корень третьей степени, внесём число 4 под корень с показателем 3: 4${R(3,3)} = ${R(3,'4³·3')} = ${R(3,192)}. 2) Так как −a${R(6,3)} — корень шестой степени и a — неотрицательное число, под знак корня вносим число a с показателем 6: −a${R(6,3)} = −${R(6,'3a⁶')}.`,`1) 4${R(3,3)} өрнегінде түбір үшінші дәрежелі болғандықтан, 4 санын түбір таңбасының ішіне үшінші дәрежемен енгіземіз: 4${R(3,3)} = ${R(3,'4³·3')} = ${R(3,192)}. 2) −a${R(6,3)} өрнегіндегі a саны теріс емес сан және түбір алтыншы дәрежелі болғандықтан, түбір таңбасының ішіне a санының алтыншы дәрежесін енгіземіз: −a${R(6,3)} = −${R(6,'3a⁶')}.`),

    ${qs([L('От чего зависит число значений корня n-й степени? Ответ обоснуйте.','n-ші дәрежелі түбір мәнінің саны неге байланысты? Жауабын түсіндіріңдер.'),L('Почему не существует корень чётной степени из отрицательного числа? Ответ обоснуйте.','Неге теріс санның жұп дәрежелі түбірі болмайды? Жауабын түсіндіріңдер.')])}

  <div class="card"><div class="tcard"><div class="stack">
    <h2>§ 6. ${L('Степень с рациональным показателем','Рационал көрсеткішті дәреже')}</h2>
    ${box(L('Вы знаете','Сендер білесіңдер'),L('Возведение в натуральную степень любого числа, а также возведение в нулевую и целую отрицательную степень числа, отличного от нуля. Известно, что для любых чисел a и b, для любых целых чисел m и n выполняются следующие свойства:','Кез келген санды натурал дәрежеге, нөлден өзге санды нөлінші және теріс бүтін дәрежеге шығару, сонымен қатар кез келген a және b сандары мен кез келген m және n бүтін сандары үшін мына қасиеттердің орындалатыны белгілі:')+`<ol class="ip">${intp.map(x=>`<li>${x}</li>`).join('')}</ol>`)}
    <p>${L('Теперь рассмотрим примеры возведения в положительную и отрицательную дробную степень любых неотрицательных чисел. Например, 3<sup>5/6</sup>; 4<sup>2/8</sup>; 16<sup>3/4</sup>; 5<sup>−3/4</sup>.','Енді кез келген теріс емес санды оң және теріс бөлшек дәрежеге шығаруды қарастырайық. Мысалы, 3<sup>5/6</sup>; 4<sup>2/8</sup>; 16<sup>3/4</sup>; 5<sup>−3/4</sup>.')}</p>
    <p>${L(`Возьмём число с рациональным показателем a<sup>m/n</sup>, где n ∈ N, m ∈ Z. Возведём данное выражение в n-ю степень: (a<sup>m/n</sup>)<sup>n</sup> = a<sup>(m/n)·n</sup> = a<sup>m</sup>. По определению корня n-й степени из последнего равенства получаем, что число a<sup>m/n</sup> есть корень n-й степени из числа a<sup>m</sup>.`,`Рационал көрсеткішті a<sup>m/n</sup> санын алайық, мұндағы n ∈ N, ал m ∈ Z. Осы өрнекті n-ші дәрежеге шығарсақ, (a<sup>m/n</sup>)<sup>n</sup> = a<sup>(m/n)·n</sup> = a<sup>m</sup>. n-ші дәрежелі түбірлердің анықтамасына сәйкес соңғы теңдіктен a<sup>m/n</sup> саны a<sup>m</sup> санының n-ші дәрежелі түбірі болады.`)}</p>
    <div class="defn">${L('<b>Определение.</b> <i><b>Степенью числа a &gt; 0 с рациональным показателем</b> m/n называется значение корня n-й степени из числа a<sup>m</sup>.</i>','<b>Анықтама.</b> <i>a &gt; 0 санының m/n <b>рационал көрсеткішті дәрежесі</b> деп a<sup>m</sup> санынан алынған n-ші дәрежелі түбірдің мәнін айтады.</i>')}<span class="fblock">a<sup>${F('m','n')}</sup> = ${R('n','a<sup>m</sup>')}. &nbsp;&nbsp;(1)</span></div>
    <p>${L('В данном случае m — любое целое, n — любое натуральное число (n &gt; 1) и m — показатель подкоренного числа, а n — показатель корня.','Мұндағы m — кез келген бүтін, n — кез келген натурал сан (n &gt; 1) және n — түбір көрсеткіші, m — түбір таңбасының ішіндегі a санының дәрежесі.')}</p>
    ${ex(L('Пример 1','1-мысал'),L('Запишем в виде корня степень с рациональным показателем: 1) 6<sup>2/5</sup>; 2) a<sup>−4/13</sup>; 3) 5<sup>1,7</sup>.','Рационал көрсеткішті дәрежені түбір түрінде жазайық: 1) 6<sup>2/5</sup>; 2) a<sup>−4/13</sup>; 3) 5<sup>1,7</sup>.'),
      L(`Используем формулу (1): 1) 6<sup>2/5</sup> = ${R(5,'6²')}; 2) a<sup>−4/13</sup> = ${R(13,'a<sup>−4</sup>')}; 3) вначале переведём десятичную дробь в показателе в обыкновенную дробь, затем воспользуемся формулой (1): 5<sup>1,7</sup> = 5<sup>17/10</sup> = ${R(10,'5<sup>17</sup>')}.`,`(1)-формуланы қолданып өрнекті: 1) 6<sup>2/5</sup> = ${R(5,'6²')}; 2) a<sup>−4/13</sup> = ${R(13,'a<sup>−4</sup>')} түрінде жазамыз; 3) көрсеткіштегі ондық бөлшекті жай бөлшекке айналдырған соң (1)-формуланы қолданамыз: 5<sup>1,7</sup> = 5<sup>17/10</sup> = ${R(10,'5<sup>17</sup>')}.`),
      `1) ${R(5,'6²')}; 2) ${R(13,'a<sup>−4</sup>')}; 3) ${R(10,'5<sup>17</sup>')}`)}
    ${ex(L('Пример 2','2-мысал'),L('Вычислим значение выражения: 1) 8<sup>4/3</sup>; 2) 625<sup>0,75</sup>; 3) 128<sup>−3/7</sup>.','1) 8<sup>4/3</sup>; 2) 625<sup>0,75</sup>; 3) 128<sup>−3/7</sup> өрнектерінің мәндерін есептейік.'),

const mq=matchMedia('(prefers-color-scheme: dark)');
function syncTheme(){const t=document.documentElement.dataset.theme||(mq.matches?'dark':'light');[...$('#themeSw').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===t));}
$('#themeSw').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.documentElement.dataset.theme=b.dataset.th;try{localStorage.setItem('rtn-theme',b.dataset.th);}catch(e){}syncTheme();});
try{const t=localStorage.getItem('rtn-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
mq.addEventListener('change',syncTheme);new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
S.seed=newSeed();T.rec={cat:'all',seed:newSeed()};
renderAll();syncTheme();
(function(){const h=location.hash.slice(1);let t=TABS.includes(h)?h:null;if(!t){try{const s=localStorage.getItem('rtn-tab');if(TABS.includes(s))t=s;}catch(e){}}showTab(t||'theory');})();

</script>
<style>
#penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:900;pointer-events:none;touch-action:auto}
#penCv.on{pointer-events:auto;touch-action:none;cursor:crosshair}
#penCv.on.er{cursor:cell}
#penCv.on.ln{cursor:copy}
#penBar{position:fixed;right:18px;bottom:18px;z-index:901;display:flex;align-items:center;gap:6px;padding:8px;border-radius:40px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 24px rgba(10,20,50,.18);font-family:'PT Sans',Arial,sans-serif}
#penBar button{all:unset;box-sizing:border-box;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .15s}
#penBar button:hover{background:var(--accent-soft)}
#penBar button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
#penBar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#penBar svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#penBar .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
#penBar .wd{background:var(--ink);border-radius:50%}
#penBar .sep{width:1px;height:36px;background:var(--line);margin:0 4px}
#penBar .tools{display:none;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#penBar.open .tools{display:flex}
#penMain{background:var(--accent)!important;color:#fff!important;width:62px!important;height:62px!important}
#penBar.open #penMain{background:var(--c2,#c2410c)!important}
@media (max-width:900px){#penBar{max-width:calc(100vw - 36px);border-radius:24px}#penBar button{width:46px;height:46px}}
</style>
<canvas id="penCv"></canvas>
<div id="penBar">
  <div class="tools">
    <button data-pc="ink" class="pc"><span class="sw"></span></button>
    <button data-pc="red" class="pc"><span class="sw"></span></button>
    <button data-pc="blue" class="pc"><span class="sw"></span></button>
    <button data-pc="green" class="pc"><span class="sw"></span></button>
    <button data-pc="orange" class="pc"><span class="sw"></span></button>
    <button data-pc="violet" class="pc"><span class="sw"></span></button>
    <span class="sep"></span>
    <button data-pw="3" class="pw"><span class="wd" style="width:6px;height:6px"></span></button>
    <button data-pw="6" class="pw"><span class="wd" style="width:11px;height:11px"></span></button>
    <button data-pw="12" class="pw"><span class="wd" style="width:18px;height:18px"></span></button>
    <span class="sep"></span>
    <button id="penCirc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 12h8"/></svg></button>
    <button id="penLine"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/><circle cx="4" cy="20" r="1.8" fill="currentColor"/><circle cx="20" cy="4" r="1.8" fill="currentColor"/></svg></button>
    <button id="penEr"><svg viewBox="0 0 24 24"><path d="M7 21h12"/><path d="M5.5 15.5 14 7l5 5-8.5 8.5H7.5z"/><path d="M9.5 11.5l5 5"/></svg></button>
    <button id="penUndo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="penClr"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg></button>
    <span class="sep"></span>
  </div>
  <button id="penMain" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg></button>
</div>
<script>
(function(){
  const cv=document.getElementById('penCv'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const LNG=()=>(typeof LANG!=='undefined'&&LANG==='kz')?1:0;
  const TIP={penMain:['Ручка: рисовать на экране (Esc — выключить)','Қалам: экранға жазу (Esc — өшіру)'],penEr:['Ластик','Өшіргіш'],penLine:['Прямая линия (линейка): потяните от начала к концу','Түзу сызық (сызғыш): басынан соңына дейін тартыңыз'],penCirc:['Окружность (циркуль): нажмите в центре и потяните до нужного радиуса','Шеңбер (циркуль): центрін басып, қажетті радиусқа дейін тартыңыз'],penUndo:['Отменить последнее','Соңғысын болдырмау'],penClr:['Стереть всё на этой вкладке','Осы беттегінің бәрін өшіру'],
    ink:['Чёрный','Қара'],red:['Красный','Қызыл'],blue:['Синий','Көк'],green:['Зелёный','Жасыл'],orange:['Оранжевый','Қызғылт сары'],violet:['Фиолетовый','Күлгін'],w3:['Тонкая линия','Жіңішке сызық'],w6:['Средняя линия','Орташа сызық'],w12:['Толстая линия','Жуан сызық']};
  const COL={ink:['#1c2746','#f1f4fb'],red:['#dc2626','#ff6b6b'],blue:['#2563eb','#7aa2ff'],green:['#15803d','#4ade80'],orange:['#ea580c','#fb923c'],violet:['#7c3aed','#c4a5ff']};
  const mqD=matchMedia('(prefers-color-scheme: dark)');
  const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqD.matches;};
  const st={on:false,color:'red',w:6,er:false,tool:null,pages:{},cleared:{},cur:null};
  const key=()=>{const t=document.querySelector('[role="tab"][aria-selected="true"]');return t?(t.id||t.dataset.tab||t.textContent):'main';};
  const list=()=>st.pages[key()]||(st.pages[key()]=[]);
  let dpr=1;
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);redraw();}
  function stroke(s){if(s.p.length===0)return;ctx.save();ctx.globalCompositeOperation=s.er?'destination-out':'source-over';
    ctx.strokeStyle=s.er?'#000':COL[s.c][dark()?1:0];ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';
    const ox=scrollX,oy=scrollY,p=s.p;
    if(s.ci){const r=p.length>1?Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]):0;ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(r,1),0,2*Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,Math.max(2,s.w/2),0,7);ctx.fill();
      if(s===st.cur&&p.length>1){ctx.setLineDash([6,6]);ctx.lineWidth=Math.max(1.5,s.w/3);ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);ctx.lineTo(p[1][0]-ox,p[1][1]-oy);ctx.stroke();}ctx.restore();return;}
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]-ox,p[0][1]-oy,s.w/2,0,7);ctx.fill();}
    else{ctx.beginPath();ctx.moveTo(p[0][0]-ox,p[0][1]-oy);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;ctx.quadraticCurveTo(p[i][0]-ox,p[i][1]-oy,mx-ox,my-oy);}
      const l=p[p.length-1];ctx.lineTo(l[0]-ox,l[1]-oy);ctx.stroke();}
    ctx.restore();}
  function redraw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);list().forEach(stroke);if(st.cur)stroke(st.cur);}
  function tips(){const l=LNG();bar.querySelectorAll('button').forEach(b=>{const k=b.id||(b.dataset.pc)||('w'+b.dataset.pw);const t=TIP[k];if(t){b.title=t[l];b.setAttribute('aria-label',t[l]);}});}
  function ui(){bar.classList.toggle('open',st.on);cv.classList.toggle('on',st.on);cv.classList.toggle('er',st.er);
    document.getElementById('penMain').setAttribute('aria-pressed',st.on);
    bar.querySelectorAll('.pc').forEach(b=>{b.setAttribute('aria-pressed',!st.er&&b.dataset.pc===st.color);b.firstElementChild.style.background=COL[b.dataset.pc][dark()?1:0];});
    bar.querySelectorAll('.pw').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.pw===st.w));
    document.getElementById('penEr').setAttribute('aria-pressed',st.er);document.getElementById('penLine').setAttribute('aria-pressed',st.tool==='line'&&!st.er);document.getElementById('penCirc').setAttribute('aria-pressed',st.tool==='circ'&&!st.er);cv.classList.toggle('ln',!!st.tool&&!st.er);tips();}
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='penMain'){st.on=!st.on;}
    else if(b.dataset.pc){st.color=b.dataset.pc;st.er=false;}
    else if(b.dataset.pw){st.w=+b.dataset.pw;}
    else if(b.id==='penEr'){st.er=!st.er;}
    else if(b.id==='penLine'){st.tool=(st.tool==='line'&&!st.er)?null:'line';st.er=false;}
    else if(b.id==='penCirc'){st.tool=(st.tool==='circ'&&!st.er)?null:'circ';st.er=false;}
    else if(b.id==='penUndo'){const L_=list();if(L_.length)L_.pop();else if(st.cleared[key()]){st.pages[key()]=st.cleared[key()];delete st.cleared[key()];}redraw();}
    else if(b.id==='penClr'){if(list().length){st.cleared[key()]=list();st.pages[key()]=[];}redraw();}
    ui();});
  function pt(e){return[e.clientX+scrollX,e.clientY+scrollY];}
  cv.addEventListener('pointerdown',e=>{if(!st.on)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    const er=st.er||e.button===5||(e.buttons&32);
    st.cur={c:st.color,w:er?Math.max(30,st.w*4):st.w,er,ln:st.tool==='line'&&!er,ci:st.tool==='circ'&&!er,p:[pt(e)]};delete st.cleared[key()];redraw();});
  cv.addEventListener('pointermove',e=>{if(!st.cur)return;if(st.cur.ci){st.cur.p=[st.cur.p[0],pt(e)];redraw();return;}if(st.cur.ln){const a=st.cur.p[0];let[b0,b1]=pt(e);const dx=b0-a[0],dy=b1-a[1],L=Math.hypot(dx,dy);if(L>0){const ang=Math.atan2(dy,dx),sn=Math.round(ang/(Math.PI/4))*(Math.PI/4);if(Math.abs(ang-sn)<0.07){b0=a[0]+L*Math.cos(sn);b1=a[1]+L*Math.sin(sn);}}st.cur.p=[a,[b0,b1]];redraw();return;}const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];(evs.length?evs:[e]).forEach(ev=>st.cur.p.push(pt(ev)));redraw();});
  const end=()=>{if(!st.cur)return;list().push(st.cur);st.cur=null;redraw();};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  addEventListener('scroll',redraw,{passive:true});addEventListener('resize',size);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&st.on){st.on=false;ui();}});
  new MutationObserver(()=>{redraw();ui();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','lang']});
  mqD.addEventListener('change',()=>{redraw();ui();});
  document.querySelectorAll('[role="tab"]').forEach(t=>new MutationObserver(redraw).observe(t,{attributes:true,attributeFilter:['aria-selected']}));
  document.addEventListener('click',e=>{if(e.target.closest('#langSw,[data-lang]'))setTimeout(tips,0);});
  size();ui();
})();
</script>
